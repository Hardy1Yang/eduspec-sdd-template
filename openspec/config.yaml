schema: spec-driven

# 專案脈絡（給 AI 產出教材時參考）
context: |
  這是一個「教學素材開發」專案，使用者是沒有程式背景的大學老師（以經濟學門為例）。
  所有教材產出遵守 ../constitution.md：繁體中文台灣用語、AI 產草稿老師審、
  不確定標「請老師確認」不編造、單檔離線 HTML、著作權與揭露、學生綠黃紅燈。
  規格化程度隨教材複雜度分級：投影片／學習單／小考走迷你規格；互動模擬走完整 SDD。

# 各產物自訂規則
rules:
  proposal:
    - 用白話寫，讓非程式老師看得懂
  tasks:
    - 每個任務都要能讓老師逐項打勾驗收
